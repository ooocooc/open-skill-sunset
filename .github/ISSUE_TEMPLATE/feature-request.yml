name: Feature request
description: Suggest a focused improvement to the audit, reports, or integrations.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Describe the user problem first. Traffic or popularity alone is not evidence that a feature belongs in the core.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What workflow is difficult today, and who encounters it?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: What should Skill Sunset do, and what should remain unchanged?
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence or example
      description: Share a sanitized example, failed workaround, or measurable acceptance criterion.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What can users do today, and why is it insufficient?
  - type: checkboxes
    id: boundaries
    attributes:
      label: Project boundaries
      options:
        - label: The proposal can preserve deterministic, read-only core analysis.
        - label: I removed credentials, private paths, and proprietary prompt content.
          required: true
